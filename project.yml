name: AO3Downloader
options:
  bundleIdPrefix: com.shasan731
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.2"
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    exactVersion: 2.11.3
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.19
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  AO3Downloader:
    type: application
    platform: macOS
    sources:
      - path: AO3Downloader
        excludes:
          - Resources/Assets.xcassets/AppIcon.appiconset/README.txt
    dependencies:
      - package: SwiftSoup
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shasan731.AO3Downloader
        PRODUCT_NAME: AO3Downloader
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ArchiveBind
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 Shahriar Hasan
        CODE_SIGN_ENTITLEMENTS: AO3Downloader/Resources/AO3Downloader.entitlements
        ARCHS: arm64
    entitlements:
      path: AO3Downloader/Resources/AO3Downloader.entitlements
  AO3DownloaderTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AO3DownloaderTests
    dependencies:
      - target: AO3Downloader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shasan731.AO3DownloaderTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AO3Downloader:
    build:
      targets:
        AO3Downloader: all
        AO3DownloaderTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - AO3DownloaderTests

