name: Bug report
description: Report reproducible ArchiveBind behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not attach story contents, cookies, credentials, or sensitive URL queries."
  - type: input
    id: version
    attributes:
      label: ArchiveBind version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Analysis, Download, Combined book, Library, Metadata, Interface, Installation, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use a sanitized public URL or synthetic example where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and sanitized error
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Privacy check
      options:
        - label: I removed story contents, cookies, credentials, and private URL data.
          required: true
