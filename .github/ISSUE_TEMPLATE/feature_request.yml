name: Feature request
description: Suggest a focused ArchiveBind improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the workflow problem, not only a proposed control.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested experience
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Reliability, privacy, or compatibility considerations
