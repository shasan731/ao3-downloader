name: Build, Test and Package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Environment
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          uname -m
      - name: Install pinned XcodeGen
        run: |
          curl -fsSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip
          echo "a760b4bf97460341316a2c00d8c87b2946c6c2729eb57e9a72abb3ef7bc0ef82  /tmp/xcodegen.zip" | shasum -a 256 -c -
          ditto -x -k /tmp/xcodegen.zip /tmp/xcodegen
          echo "/tmp/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate and inspect project
        run: |
          xcodegen generate --spec project.yml
          xcodebuild -list -project AO3Downloader.xcodeproj
      - name: Test
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project AO3Downloader.xcodeproj -scheme AO3Downloader -configuration Debug \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath "$PWD/build/DerivedData" \
            -resultBundlePath "$PWD/build/TestResults.xcresult" CODE_SIGNING_ALLOWED=NO test 2>&1 | tee build/test.log
      - name: Annotate test failures
        if: failure()
        run: |
          if test -f build/test.log; then
            grep -E '(^|: )(error:|fatal error:|Testing failed:)' build/test.log | tail -100 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -40 build/test.log | while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              echo "::notice::$line"
            done
          fi
      - name: Build release
        if: success()
        run: |
          xcodebuild -project AO3Downloader.xcodeproj -scheme AO3Downloader -configuration Release \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO build
          app="build/DerivedData/Build/Products/Release/AO3Downloader.app"
          /usr/bin/codesign --force --sign - \
            --entitlements AO3Downloader/Resources/AO3Downloader.entitlements "$app"
          Scripts/verify-build.sh "$app"
      - name: Package
        run: Scripts/package-app.sh build/DerivedData/Build/Products/Release/AO3Downloader.app build/artifacts
      - name: Upload products
        uses: actions/upload-artifact@v4
        with:
          name: ArchiveBind-${{ github.sha }}
          path: build/artifacts/*
          retention-days: 14
      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ github.sha }}
          path: |
            build/TestResults.xcresult
            build/test.log
          retention-days: 7

