name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned XcodeGen
        run: |
          curl -fsSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip
          echo "a760b4bf97460341316a2c00d8c87b2946c6c2729eb57e9a72abb3ef7bc0ef82  /tmp/xcodegen.zip" | shasum -a 256 -c -
          ditto -x -k /tmp/xcodegen.zip /tmp/xcodegen
          echo "/tmp/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Test and build once
        run: |
          xcodegen generate --spec project.yml
          xcodebuild -project AO3Downloader.xcodeproj -scheme AO3Downloader -configuration Release -destination 'platform=macOS,arch=arm64' -derivedDataPath "$PWD/build/DerivedData" CODE_SIGNING_ALLOWED=NO test build
          app="build/DerivedData/Build/Products/Release/AO3Downloader.app"
          /usr/bin/codesign --force --sign - \
            --entitlements AO3Downloader/Resources/AO3Downloader.entitlements "$app"
          Scripts/verify-build.sh "$app"
          Scripts/package-app.sh "$app" build/artifacts
      - name: Publish ArchiveBind release
        uses: softprops/action-gh-release@v2
        with:
          name: ArchiveBind ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: true
          body: |
            ## Install
            Download the DMG, verify it against `SHA256SUMS.txt`, and drag ArchiveBind to Applications.

            This community build has an ad-hoc integrity signature but is not Developer ID signed or notarized. macOS may require **System Settings → Privacy & Security → Open Anyway** after the first launch attempt. Never disable Gatekeeper globally.
          files: build/artifacts/*

